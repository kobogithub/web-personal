version: 2

updates:
  # Dependencias del sitio. El proyecto usa pnpm; el ecosistema `npm` de
  # Dependabot cubre pnpm-lock.yaml.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    # Astro 6+ no es mergeable hasta resolver #83: `@astrojs/tailwind` declara
    # `peer astro: ^3 || ^4 || ^5` y no tiene versión compatible, así que subir
    # de major dejaría el sitio sin integración de Tailwind. Sin esta regla
    # Dependabot reabre el PR cada vez que se cierra.
    #
    # QUITAR estas tres entradas al cerrar #83.
    #
    # Solo afecta a las actualizaciones de versión: las alertas de seguridad se
    # siguen reportando igual.
    ignore:
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']

    # El grueso del árbol cuelga de Astro y sus integraciones: agrupar evita
    # una avalancha de PRs que hay que mergear en conjunto igual.
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      unocss:
        patterns:
          - 'unocss'
          - '@unocss/*'
      dev-tooling:
        dependency-type: 'development'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # El workflow de deploy usa actions de terceros; conviene mantenerlas al día.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
