name: Deploy to GitHub Pages

on:
  # El sitio se publica desde `prod`. `dev` es la rama de trabajo y la default
  # del repositorio, así que mergear a `dev` no despliega nada: hay que
  # mergear `dev` → `prod` para que esto corra.
  push:
    branches: [prod]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22
          # No se declara `package-manager` acá a propósito. Pasarlo sin versión
          # hace que la action le mande `version: latest` a `pnpm/action-setup`,
          # que falla con "Multiple versions of pnpm specified" al chocar con el
          # campo `packageManager` de package.json.
          #
          # Ese campo ya es la declaración explícita, y más fuerte: fija
          # pnpm@10.15.1 con su hash de integridad. La detección del gestor por
          # lockfile tampoco es ambigua desde que se eliminó package-lock.json.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
