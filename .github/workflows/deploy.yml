name: Deploy to GitHub Pages

on:
  # El sitio se publica desde `prod`. `dev` es la rama de trabajo y la default
  # del repositorio, así que mergear a `dev` no despliega nada: hay que
  # mergear `dev` → `prod` para que esto corra.
  push:
    branches: [prod]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22
          # Explícito a propósito. Sin este input la action deduce el gestor
          # mirando qué lockfile encuentra, que es exactamente cómo el build de
          # CI podía terminar resolviendo con npm mientras el desarrollo usa
          # pnpm. Declararlo hace que un lockfile espurio no cambie el build.
          package-manager: pnpm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
