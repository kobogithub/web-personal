onlyBuiltDependencies:
  - esbuild
  - sharp

# `tsx` (peer opcional de vite) arrastra esbuild 0.23.1, afectado por
# GHSA-67mh-4wv8-2f99: cualquier sitio que visites puede mandarle pedidos al
# dev server de esbuild y leer la respuesta. Nadie publica un fix aguas
# arriba porque es una dependencia de una dependencia opcional, y el sitio
# compila estatico, asi que en produccion no corre nada de esto.
#
# Igual se fuerza, por dos razones: el dev server SI se expone a la LAN
# cuando se revisa el sitio desde otro dispositivo, y el repo se muestra como
# carta de presentacion — cero avisos en la pestana Security es parte de eso
# (ver issue #71). Sacar este override cuando vite deje de resolver tsx a un
# esbuild < 0.25.
overrides:
  esbuild@<0.25.0: '>=0.25.0'
  # `@tailwindcss/node` 4.3.3 fija source-map-js 1.2.1, afectado por una alerta
  # high (< 1.2.2). Mismo criterio que el de esbuild. Sacarlo cuando tailwind
  # suba su dependencia.
  source-map-js@<1.2.2: '>=1.2.2'
  # Alertas de Dependabot de nov-2026 en dependencias transitivas (zod via
  # astro, postcss-selector-parser via tailwind, fast-xml-parser). Mismo
  # criterio que los de arriba. Sacarlos cuando los paquetes que las traen suban.
  zod@>=4 <4.6.6: ^4.6.6
  postcss-selector-parser@<6.1.5: ^6.1.5
  fast-xml-parser@<5.12.0: ^5.12.0
  # El binding wasm de rolldown acepta `@emnapi/*` 2.0.0-beta.2 y pnpm lo
  # termina compartiendo con @astrojs/astro2tsx, que usa core 1.x: la mezcla
  # rompe `astro check` con "this.bridge.setLastError is not a function".
  # Sacarlo cuando emnapi 2 salga estable.
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
